[package]
name = "bevy_pbr_generator"
version = "0.1.0"
edition = "2021"
license = "MIT"
default-run = "bevy_pbr_generator"

[dependencies]
bevy = { version = "0.20", features = [
    "bevy_feathers",
    "file_watcher",
    "embedded_watcher",
    "png",
    "pbr_transmission_textures",
    "pbr_specular_textures",
    "pbr_anisotropy_texture",
    "pbr_multi_layer_material_textures",
    "system_clipboard",
] }
half = "2"
image = { version = "0.24", default-features = false, features = ["png"] }
wesl = "0.6"

[dev-dependencies]
naga = { version = "30", features = ["wgsl-in"] }
